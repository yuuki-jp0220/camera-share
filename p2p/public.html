<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camera Share - 公開</title><link rel="stylesheet" href="style.css"><body><main><h1>📷 Camera Share 公開サイト</h1><section><h2>公開端末を接続</h2><p>送信サイトの「公開用コード」を貼り付けて接続します。</p><textarea id="remoteOffer" placeholder="送信サイトの公開用コード"></textarea><button id="makeAnswer">回答コードを作成</button><textarea id="localAnswer" placeholder="回答コードを送信サイトに戻して貼り付け"></textarea><button data-copy="localAnswer">回答コードをコピー</button><p id="status">未接続</p></section><section><h2>公開映像・音声</h2><p id="visibility">公開設定を確認中…</p><video id="remoteVideo" autoplay playsinline controls hidden></video><button id="playAudio" hidden>音声を再生</button><p>送信側と管理側の両方で公開が許可されたメディアだけが再生されます。</p></section></main><script src="p2p.js"></script><script>CameraShare.init("public");</script></body></html>
