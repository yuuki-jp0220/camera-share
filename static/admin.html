<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理サイト</title><style>body{font:16px system-ui;background:#101827;color:#eef;padding:18px;max-width:900px;margin:auto}.card{background:#1c293b;padding:16px;border-radius:14px;margin:14px 0}input{padding:12px;border-radius:8px}button{padding:12px;margin:5px;border:0;border-radius:9px;background:#3679e8;color:white}label{display:block;padding:12px}img{width:100%;max-height:65vh;object-fit:contain;background:#000;border-radius:12px}#app{display:none}</style><h1>🔐 管理サイト</h1><section id="login" class="card"><h2>管理者ログイン</h2><input id="password" type="password" placeholder="管理者パスワード"><button id="enter">ログイン</button><p id="error"></p></section><main id="app"><section class="card"><h2>送信状態</h2><p id="status">確認中</p><h2>管理者プレビュー（公開設定に関係なく表示）</h2><img id="frame" alt="送信元映像"><p><button id="play">管理音声を再生</button><button id="stop">音声停止</button></p><audio id="audio" controls></audio></section><section class="card"><h2>public公開設定（管理者側）</h2><label><input id="vp" type="checkbox" checked> 映像をpublicに公開</label><label><input id="ap" type="checkbox" checked> 音声をpublicに公開</label><p>非公開にしても、管理サイトの映像・音声確認と送信元の送信は継続します。</p></section><button id="logout">ログアウト</button></main><script>
const $=x=>document.getElementById(x);let audioLoop=null;
async function req(url,opt){return fetch(url,opt)}
async function openApp(){$("login").style.display="none";$("app").style.display="block";await refresh();setInterval(refresh,700)}
$("enter").onclick=async()=>{let r=await req("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("password").value})}),d=await r.json();if(!r.ok){$("error").textContent=d.error;return}openApp()};
async function refresh(){let r=await req("/api/admin/state");if(!r.ok)return;let s=await r.json();$("status").textContent="送信端末："+(s.connected?"接続中":"未接続")+" ／ カメラ："+(s.cam?"送信中":"停止")+" ／ マイク："+(s.mic?"送信中":"停止");if(s.has_frame)$("frame").src="/api/admin/frame?t="+Date.now();$("vp").checked=s.av;$("ap").checked=s.aa}
async function settings(){await req("/api/admin/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({av:$("vp").checked,aa:$("ap").checked})})}
$("vp").onchange=settings;$("ap").onchange=settings;
$("play").onclick=()=>{if(audioLoop)return;audioLoop=setInterval(async()=>{try{let r=await req("/api/admin/audio");if(r.status===200){let u=URL.createObjectURL(await r.blob());$("audio").src=u;await $("audio").play()}}catch(e){}},120)};
$("stop").onclick=()=>{clearInterval(audioLoop);audioLoop=null;$("audio").pause();$("audio").removeAttribute("src")};
$("logout").onclick=async()=>{await req("/api/admin/logout",{method:"POST"});location.reload()};
req("/api/admin/me").then(r=>r.json()).then(d=>{if(d.auth)openApp()});
</script></html>
