<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camera Share P2P - 管理</title><link rel="stylesheet" href="style.css"><body><main><h1>🔐 管理サイト（P2P）</h1><section><h2>送信端末のコードを貼り付け</h2><textarea id="remoteOffer" placeholder="送信サイトの管理用コードを貼り付け"></textarea><button id="makeAnswer">回答コードを作成</button><textarea id="localAnswer" placeholder="作成した回答コード"></textarea><button data-copy="localAnswer">回答コードをコピー</button><p id="status">未接続</p></section><section><h2>管理者プレビュー</h2><video id="remoteVideo" autoplay playsinline controls></video><h2>public公開設定（管理者側）</h2><label><input type="checkbox" id="av" checked> 映像をpublicに公開</label><label><input type="checkbox" id="aa" checked> 音声をpublicに公開</label><p>ここをOFFにしても管理者プレビューには影響しません。</p></section></main><script src="p2p.js"></script><script>CameraShare.init("admin");</script></body></html>
