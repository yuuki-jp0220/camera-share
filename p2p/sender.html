<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camera Share P2P - 送信</title><link rel="stylesheet" href="style.css"><body><main><h1>📡 送信サイト（P2P）</h1><p class="note">同じWi-Fi内で端末同士を直接接続します。最初の接続だけ、接続コードを手動で交換します。</p><section><h2>1. カメラ・マイク</h2><button id="start">カメラ・マイクを開始</button><button id="stop" disabled>停止</button><video id="preview" autoplay muted playsinline></video><p id="status">未開始</p></section><section><h2>2. 管理端末を接続</h2><button id="makeAdmin" disabled>管理用コードを作成</button><textarea id="adminOffer" placeholder="作成した接続コードがここに表示されます"></textarea><button data-copy="adminOffer">コードをコピー</button><textarea id="adminAnswer" placeholder="管理サイトで作成した回答コードを貼り付け"></textarea><button id="acceptAdmin">管理端末の回答を登録</button><p id="adminState">未接続</p></section><section><h2>3. 公開端末を接続</h2><button id="makePublic" disabled>公開用コードを作成</button><textarea id="publicOffer" placeholder="作成した接続コードがここに表示されます"></textarea><button data-copy="publicOffer">コードをコピー</button><textarea id="publicAnswer" placeholder="公開サイトで作成した回答コードを貼り付け"></textarea><button id="acceptPublic">公開端末の回答を登録</button><p id="publicState">未接続</p></section><section><h2>送信側の公開設定</h2><label><input type="checkbox" id="sv" checked> 映像を公開可能にする</label><label><input type="checkbox" id="sa" checked> 音声を公開可能にする</label><p>管理側の公開設定もONの場合だけ、公開端末に届きます。</p></section></main><script src="p2p.js"></script><script>CameraShare.init("sender");</script></body></html>
