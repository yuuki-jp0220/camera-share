<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>送信サイト</title><style>body{font:16px system-ui;background:#101827;color:#eef;padding:18px;max-width:760px;margin:auto}.card{background:#1c293b;padding:16px;border-radius:14px;margin:14px 0}button{padding:12px;margin:5px;border:0;border-radius:9px;background:#3679e8;color:white}label{display:block;padding:12px}video{width:100%;background:#000;border-radius:12px}#status{padding:12px;background:#26364b;border-radius:9px}</style><h1>📡 送信サイト</h1><p id="status">未接続</p><section class="card"><button id="connect">送信端末として接続</button><button id="disconnect" disabled>切断</button><p><button id="camera" disabled>カメラ送信開始</button><button id="microphone" disabled>音声送信開始</button></p><video id="preview" autoplay muted playsinline></video></section><section class="card"><h2>public公開設定</h2><label><input type="checkbox" id="videoPublic" checked disabled> 映像を公開</label><label><input type="checkbox" id="audioPublic" checked disabled> 音声を公開</label><p>送信中でも変更できます。非公開にしても管理サイトでは確認できます。</p></section><script>
const $=x=>document.getElementById(x);let token="",cam=false,mic=false,stream=null,micStream=null,ctx=null,proc=null,timer=null;
async function api(url,opt={}){return fetch(url,{...opt,headers:{"Content-Type":"application/json","X-Sender-Token":token,...(opt.headers||{})}})}
async function sync(){if(token)await api("/api/sender/state",{method:"POST",body:JSON.stringify({cam,mic,sv:$("videoPublic").checked,sa:$("audioPublic").checked})})}
$("connect").onclick=async()=>{let r=await fetch("/api/sender/claim",{method:"POST"}),d=await r.json();if(!r.ok){$("status").textContent=d.error;return}token=d.token;$("status").textContent="接続中（この端末のみ送信可能）";$("disconnect").disabled=false;$("camera").disabled=$("microphone").disabled=false;$("videoPublic").disabled=$("audioPublic").disabled=false;heartbeat()};
async function heartbeat(){if(!token)return;await sync();setTimeout(heartbeat,4000)}
$("camera").onclick=async()=>{if(!cam){try{stream=await navigator.mediaDevices.getUserMedia({video:true});$("preview").srcObject=stream;cam=true;$("camera").textContent="カメラ送信停止";timer=setInterval(async()=>{let v=$("preview");if(!cam||!v.videoWidth)return;let c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);let b=await new Promise(r=>c.toBlob(r,"image/jpeg",.7));if(b)api("/api/sender/frame",{method:"POST",headers:{"Content-Type":"image/jpeg"},body:b})},300)}catch(e){$("status").textContent="カメラ開始エラー："+e.message}}else{cam=false;clearInterval(timer);stream?.getTracks().forEach(t=>t.stop());stream=null;$("preview").srcObject=null;$("camera").textContent="カメラ送信開始"}await sync()};
$("microphone").onclick=async()=>{if(!mic){try{micStream=await navigator.mediaDevices.getUserMedia({audio:true});ctx=new AudioContext();let src=ctx.createMediaStreamSource(micStream);proc=ctx.createScriptProcessor(2048,1,1);src.connect(proc);proc.connect(ctx.destination);proc.onaudioprocess=e=>{if(!mic)return;let f=e.inputBuffer.getChannelData(0),b=new ArrayBuffer(f.length*2),v=new DataView(b);for(let i=0;i<f.length;i++)v.setInt16(i*2,Math.max(-32768,Math.min(32767,f[i]*32767)),true);api("/api/sender/audio",{method:"POST",headers:{"Content-Type":"application/octet-stream"},body:b})};mic=true;$("microphone").textContent="音声送信停止"}catch(e){$("status").textContent="マイク開始エラー："+e.message}}else{mic=false;proc?.disconnect();ctx?.close();micStream?.getTracks().forEach(t=>t.stop());$("microphone").textContent="音声送信開始"}await sync()};
$("videoPublic").onchange=sync;$("audioPublic").onchange=sync;
$("disconnect").onclick=async()=>{cam=mic=false;clearInterval(timer);stream?.getTracks().forEach(t=>t.stop());micStream?.getTracks().forEach(t=>t.stop());await api("/api/sender/release",{method:"POST"});token="";$("status").textContent="切断しました";$("disconnect").disabled=true;$("camera").disabled=$("microphone").disabled=true;$("videoPublic").disabled=$("audioPublic").disabled=true;$("preview").srcObject=null};
</script></html>
